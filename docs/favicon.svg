<?xml version="1.0" encoding="UTF-8"?>
<!-- RC Setlist mark: the landing's inverted RC block. Letters are drawn, not
     typeset, so the icon never depends on a font being installed. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="RC Setlist" shape-rendering="crispEdges">
  <rect width="64" height="64" fill="#ffa133"/>
  <g fill="#0e0e0e">
    <rect x="8" y="14" width="7" height="36"/>
    <rect x="15" y="14" width="15" height="7"/>
    <rect x="23" y="21" width="7" height="13"/>
    <rect x="15" y="27" width="8" height="7"/>
    <path d="M17 34h7l7 16h-7z" shape-rendering="geometricPrecision"/>
    <rect x="35" y="14" width="21" height="7"/>
    <rect x="35" y="21" width="7" height="22"/>
    <rect x="35" y="43" width="21" height="7"/>
  </g>
</svg>
