<?xml version="1.0" encoding="UTF-8"?>
<!-- Social preview, drawn as a page of the operator sheet. Rendered to
     og-image.png by scripts/render-site-assets.mjs, which supplies Martian Mono
     and the capture; opened from docs/ it resolves both on its own. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="RC Setlist: Arrangement locators become a setlist to run the show and a display the band reads.">
  <style>
    text { font-family: 'Martian Mono', ui-monospace, monospace; }
    .mast { font-size: 15px; font-weight: 600; font-stretch: 87.5%; fill: #a0a0a0; }
    .lede { font-size: 25px; font-weight: 400; fill: #e4e4e4; }
    .badge { font-size: 16px; font-weight: 800; }
    .foot { font-size: 14px; font-weight: 600; font-stretch: 87.5%; fill: #a0a0a0; }
  </style>
  <defs>
    <symbol id="beat" viewBox="0 0 24 24"><path d="M14 3v10.6a3.4 3.4 0 1 0 2 3.1V7h3V3h-5Z"/></symbol>
    <symbol id="loop" viewBox="0 0 24 24"><path d="M12 5V2L8 6l4 4V7a5 5 0 1 1-5 5H5a7 7 0 1 0 7-7Z"/></symbol>
    <symbol id="next" viewBox="0 0 24 24"><path d="M5 5v14l9-7-9-7Zm11 0h3v14h-3V5Z"/></symbol>
    <symbol id="stop" viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12"/></symbol>
  </defs>

  <rect width="1200" height="630" fill="#0e0e0e"/>

  <!-- masthead -->
  <text x="56" y="50" class="mast" style="fill:#f2f2f2;font-weight:800">RC SETLIST</text>
  <line x1="186" y1="30" x2="186" y2="60" stroke="#333333"/>
  <text x="206" y="50" class="mast">V1.0.0</text>
  <line x1="290" y1="30" x2="290" y2="60" stroke="#333333"/>
  <text x="310" y="50" class="mast">ABLETON LIVE 12.4.5+ SUITE</text>
  <text x="1144" y="50" class="mast" text-anchor="end">SOURCE-AVAILABLE</text>
  <line x1="56" y1="72" x2="1144" y2="72" stroke="#444444"/>

  <!-- title: the inverted RC block -->
  <rect x="56" y="112" width="184" height="112" fill="#ffa133"/>
  <text x="70" y="206" style="font-size:98px;font-weight:800;font-stretch:112.5%;fill:#0e0e0e">RC</text>
  <text x="262" y="206" style="font-size:98px;font-weight:800;font-stretch:112.5%;fill:#e4e4e4">Setlist</text>

  <!-- lede -->
  <text x="56" y="298" class="lede">Arrangement locators become</text>
  <text x="56" y="336" class="lede">a setlist to run the show</text>
  <text x="56" y="374" class="lede">and a display the band reads.</text>

  <!-- the tags, as the extension draws them -->
  <g transform="translate(56 430)">
    <rect width="124" height="34" fill="rgba(48,209,88,0.12)" stroke="rgba(66,216,137,0.45)"/>
    <use href="#beat" x="10" y="8" width="18" height="18" fill="#5ce08b"/>
    <text x="34" y="23" class="badge" fill="#5ce08b">120 BPM</text>
  </g>
  <g transform="translate(192 430)">
    <rect width="124" height="34" fill="rgba(191,90,242,0.12)" stroke="rgba(189,145,255,0.45)"/>
    <use href="#loop" x="10" y="8" width="18" height="18" fill="#cdaaff"/>
    <text x="34" y="23" class="badge" fill="#cdaaff">LOOP 2x</text>
  </g>
  <g transform="translate(328 430)">
    <rect width="90" height="34" fill="rgba(10,132,255,0.12)" stroke="rgba(115,169,255,0.45)"/>
    <use href="#next" x="10" y="8" width="18" height="18" fill="#8ab4ff"/>
    <text x="34" y="23" class="badge" fill="#8ab4ff">NEXT</text>
  </g>
  <g transform="translate(430 430)">
    <rect width="90" height="34" fill="rgba(255,55,95,0.12)" stroke="rgba(255,93,108,0.45)"/>
    <use href="#stop" x="10" y="8" width="18" height="18" fill="#ff8f99"/>
    <text x="34" y="23" class="badge" fill="#ff8f99">STOP</text>
  </g>

  <!-- the real capture -->
  <text x="700" y="252" class="mast" style="fill:#ffa133;font-weight:800">FIG. 1</text>
  <text x="772" y="252" class="mast" style="fill:#f2f2f2">STAGE CONTROL, AS SHIPPED</text>
  <rect x="699.5" y="265.5" width="445" height="251" fill="#141414" stroke="#444444"/>
  <image href="media/en/stage-control.png" x="700" y="266" width="444" height="250" preserveAspectRatio="xMidYMid slice"/>

  <!-- foot -->
  <line x1="56" y1="556" x2="1144" y2="556" stroke="#333333"/>
  <text x="56" y="590" class="foot" style="fill:#ffb35c">NTWORM.GITHUB.IO/RC-SETLIST</text>
  <text x="1144" y="590" class="foot" text-anchor="end">LOCAL NETWORK · NO ACCOUNT · NO TELEMETRY</text>
</svg>
